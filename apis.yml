aid: gv
name: GV
description: >-
  GV (formerly Google Ventures) is the venture capital arm of Alphabet, founded in 2009 by Bill Maris and
  headquartered in the San Francisco Bay Area with additional offices in New York, Cambridge, and London.
  With Alphabet as its sole limited partner, GV operates with the reliability of a single LP, the autonomy of
  a traditional venture firm, and deep technical expertise, investing from seed through growth stage across
  technology and life sciences. Its focus areas span AI, enterprise, consumer, frontier tech, and life
  sciences, with a heavy recent emphasis on the AI frontier, from applications and developer tools to
  infrastructure and healthcare. GV manages over $13 billion in assets and supports roughly 400 active
  portfolio companies across North America, Europe, and Israel. The firm has backed notable companies
  including Uber, Slack, GitLab, Nest, Flatiron Health, Lemonade, Vercel, Isomorphic Labs, and insitro,
  with a track record of more than 80 IPOs and 230+ M&A exits.
